<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dispatch Portal</title>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    display: flex;
    height: 100vh;
    align-items: center;
    justify-content: center;
  }

  .container {
    background: white;
    padding: 30px;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.12);
    width: 90%;
    max-width: 420px;
    text-align: center;
  }

  h1 {
    font-size: 24px;
    margin-bottom: 8px;
  }

  p {
    color: #666;
    margin-bottom: 22px;
    font-size: 14px;
  }

  button {
    width: 100%;
    padding: 16px;
    margin: 10px 0;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    color: white;
  }

  .android {
    background: #1a73e8;
  }

  .iphone {
    background: #111;
  }

  button:active {
    transform: scale(0.98);
  }
</style>
</head>

<body>

<div class="container">

  <h1>Dispatcher Portal</h1>
  <p>Select your dashboard</p>

  <button class="android"
    onclick="openDashboard('https://susaxman-cell.github.io/rides/main/Dispatch/DispatcherDashboardAndroid.html')">
    Android Dispatcher Dashboard
  </button>

  <button class="iphone"
    onclick="openDashboard('https://susaxman-cell.github.io/rides/main/Dispatch/DispatcheriPhone.html')">
    iPhone Dispatcher Dashboard
  </button>

</div>

<script>
function openDashboard(url) {
  window.location.href = url;
}
</script>

</body>
</html>
